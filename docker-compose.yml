name: cluster-dashboard

# Single-service dashboard. The ssh keys + config are mounted read-only
# from the host's ~/.ssh so the image never contains credentials. The host
# user must exist in /etc/passwd inside the container at the UID the keys
# are owned by — the Dockerfile defaults to 1000:1000 (bramirezj on this
# host); override via BUILD_UID/BUILD_GID if yours is different.

services:
  dashboard:
    build: .
    image: cluster-dashboard:latest
    container_name: cluster-dashboard
    restart: unless-stopped
    ports:
      # Bound to 0.0.0.0 so the dashboard is reachable from the LAN
      # (phone, laptop, etc.) at http://<host-ip>:9090. The daemon serves
      # the same data with no auth, so only do this on a network you
      # trust. If you want to expose it beyond the LAN, put it behind
      # Nginx Proxy Manager with auth — see README.
      - "9090:9090"
    environment:
      PORT: "9090"
      POLL_INTERVAL_MS: "30000"
      HISTORY_SAMPLES: "120"
      SSH_CONNECT_TIMEOUT_MS: "5000"
      SSH_CMD_TIMEOUT_MS: "4000"
      SSH_USER: "bramirezj"
      SSH_KEYS_DIR: "/home/bramirezj/.ssh"
      CLUSTER_SERVERS: "server-11,server-17,server-18,server-19"
    volumes:
      - /home/bramirezj/.ssh:/home/bramirezj/.ssh:ro
    # No healthcheck yet — the daemon listens on PORT but doesn't expose
    # a readiness probe that distinguishes "polling" from "crashed". Add a
    # GET /api/health that returns 200 only after the first successful poll
    # if you wire healthcheck to compose's depends_on: condition: healthy.