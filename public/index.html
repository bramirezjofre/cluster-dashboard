<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cluster-dashboard</title>
<style>
  :root {
    --bg: #0c0e12; --surface: #16191f; --surface-2: #1d2128;
    --border: #2a2f37; --label: #e6e8ec; --label-2: #9aa1ac; --label-3: #5d6675;
    --acc: #30d158; --warn: #ffd60a; --bad: #ff453a; --info: #0a84ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--label);
               font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { padding: 16px 22px; display: flex; align-items: center; gap: 16px;
           border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  header .meta { color: var(--label-2); font-size: 12px; font-family: var(--mono); }
  header .meta b { color: var(--label); font-weight: 500; }
  main { padding: 22px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px 18px; transition: border-color .2s; }
  .card.bad { border-color: var(--bad); }
  .card .head { display: flex; justify-content: space-between; align-items: baseline;
                margin-bottom: 14px; gap: 8px; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .status { font-size: 11px; font-family: var(--mono); padding: 2px 8px;
                  border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
  .card .status.ok { background: color-mix(in srgb, var(--acc) 18%, transparent); color: var(--acc); }
  .card .status.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .card .err { color: var(--bad); font-family: var(--mono); font-size: 12px;
               background: var(--surface-2); padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .stat .l { font-size: 11px; color: var(--label-3); text-transform: uppercase;
             letter-spacing: .06em; margin-bottom: 4px; }
  .stat .v { font-size: 19px; font-family: var(--mono); font-weight: 500;
             letter-spacing: -.01em; }
  .stat .v small { color: var(--label-2); font-size: 12px; font-weight: 400;
                   margin-left: 4px; }
  .spark { width: 100%; height: 38px; margin-top: 6px; display: block; }
  .spark path.area { fill: var(--acc); fill-opacity: .12; stroke: none; }
  .spark path.line { fill: none; stroke: var(--acc); stroke-width: 1.5; }
  .card.bad .spark path.area { fill: var(--bad); fill-opacity: .12; }
  .card.bad .spark path.line { stroke: var(--bad); }
  .bar { background: var(--surface-2); border-radius: 4px; height: 6px;
         margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--acc);
             transition: width .3s, background .3s; }
  .bar.warn > i { background: var(--warn); }
  .bar.bad > i { background: var(--bad); }
  .disks { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .disk { font-size: 11px; font-family: var(--mono); color: var(--label-2); }
  .disk .name { color: var(--label-3); }
  .loading { color: var(--label-3); font-style: italic; }

  /* --- card clickability -------------------------------------------------- */
  /* Cards became clickable when the container-inspector feature shipped
     (commit "Add docker container modal"). We use a subtle hover state
     and a pointer cursor to hint at it. The card itself is not a button
     (we still want to be able to select text inside it), so we listen
     for clicks via event delegation on the #cards container. */
  .card { cursor: pointer; }
  .card:hover { border-color: var(--label-3); }
  .card.bad:hover { border-color: var(--bad); }
  /* The 'N containers' pill used to be the only click target inside the
     card. We made the whole card clickable in revision 2 of the modal
     feature (see commit "Add docker container modal" follow-up), so the
     pill is now decorative. Keep the cursor:pointer style on it too so
     that if the user happens to click the pill text directly, they get
     visual feedback that the whole card is interactive. */
  .card .head .containers-pill {
    font-size: 11px; font-family: var(--mono); color: var(--label-2);
    background: var(--surface-2); padding: 2px 8px; border-radius: 999px;
  }

  /* --- modals ------------------------------------------------------------- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 720px; max-height: 80vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal.wide { max-width: 960px; }
  .modal .mh {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .modal .mh h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal .mh .sub { font-size: 11px; color: var(--label-3); font-family: var(--mono); }
  .modal .mh button.close {
    background: transparent; border: 0; color: var(--label-2); font-size: 18px;
    cursor: pointer; padding: 0 6px; line-height: 1;
  }
  .modal .mh button.close:hover { color: var(--label); }
  .modal .mb { padding: 14px 18px; overflow-y: auto; flex: 1; }
  .modal .mf {
    padding: 10px 18px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--label-3); font-family: var(--mono);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal .mf > span { font-size: 11px; color: var(--label-3); font-family: var(--mono); }
  .modal .mf .back-btn {
    background: var(--surface-2); color: var(--label); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  .modal .mf .back-btn:hover { background: var(--border); color: var(--acc); }
  .container-row {
    display: grid; grid-template-columns: 24px 1fr 1fr auto; gap: 10px;
    align-items: center; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; font-family: var(--mono); font-size: 12px;
  }
  .container-row:hover { background: var(--surface-2); }
  .container-row .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--label-3); justify-self: center; }
  .container-row .dot.up { background: var(--acc); }
  .container-row .dot.down { background: var(--label-3); }
  .container-row .name { color: var(--label); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .container-row .image { color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .container-row .status { color: var(--label-2); font-size: 11px; }
  .log-box {
    background: #0a0c10; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    color: #cdd3df; max-height: 60vh; overflow-y: auto; white-space: pre-wrap;
    word-break: break-all;
  }
  .log-box .empty { color: var(--label-3); font-style: italic; }
  .err-banner {
    color: var(--bad); font-family: var(--mono); font-size: 12px;
    background: var(--surface-2); padding: 10px 12px; border-radius: 8px;
  }
</style>
</head>
<body>
<header>
  <h1>cluster-dashboard</h1>
  <div class="meta">
    refreshing every <b id="iv">30</b>s · last poll <b id="last">…</b> · <b id="errs">0</b> error(s)
  </div>
</header>
<main id="cards">
  <div class="loading">loading…</div>
</main>
<script>
const POLL_MS = 30_000
const CARDS = document.getElementById('cards')
const elLast = document.getElementById('last')
const elErrs = document.getElementById('errs')
const elIv = document.getElementById('iv')

// Build a polyline + area path from a series of values scaled to the SVG
// viewport. The series is plain numbers; we rescale to 0..max so a flat
// line at the top doesn't collapse to zero width.
function sparkPath(values, w = 320, h = 38) {
  if (!values || values.length < 2) return { line: '', area: '' }
  const max = Math.max(...values, 1)
  const min = Math.min(...values, 0)
  const range = Math.max(max - min, 0.001)
  const stepX = w / (values.length - 1)
  const points = values.map((v, i) => {
    const x = i * stepX
    const y = h - ((v - min) / range) * (h - 4) - 2
    return [x.toFixed(1), y.toFixed(1)]
  })
  const line = 'M' + points.map(p => p.join(',')).join(' L')
  const area = line + ` L${w},${h} L0,${h} Z`
  return { line, area }
}

// Color threshold for the CPU/RAM/disk bars. The numbers are arbitrary —
// tuned for a small server; adjust if you ever monitor a beefier box.
function colorFor(pct, kind) {
  if (kind === 'cpu') return pct >= 85 ? 'bad' : pct >= 60 ? 'warn' : ''
  if (kind === 'mem') return pct >= 90 ? 'bad' : pct >= 75 ? 'warn' : ''
  if (kind === 'disk') return pct >= 85 ? 'bad' : pct >= 70 ? 'warn' : ''
  return ''
}

function fmtBytes(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB'
  return Math.round(mb) + ' MB'
}
function fmtUptime(sec) {
  if (!sec) return '—'
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
        m = Math.floor((sec % 3600) / 60)
  if (d > 0) return `${d}d ${h}h`
  if (h > 0) return `${h}h ${m}m`
  return `${m}m`
}
function fmtAgo(ts) {
  if (!ts) return '—'
  const s = Math.floor((Date.now() - ts) / 1000)
  if (s < 60) return s + 's ago'
  if (s < 3600) return Math.floor(s / 60) + 'm ago'
  return Math.floor(s / 3600) + 'h ago'
}

function renderCard(alias, s, h) {
  const ok = s.ok && s.last
  const last = s.last
  const sparkSvg = (vals) => `<svg class="spark" viewBox="0 0 320 38" preserveAspectRatio="none">` +
    (() => { const p = sparkPath(vals); return `<path class="area" d="${p.area}"/><path class="line" d="${p.line}"/>` })() +
    `</svg>`
  const cpuPct = ok ? last.cpu : 0
  const memPct = ok ? last.memPct : 0
  const disks = (ok && last.disks) ? last.disks : []
  return `
    <div class="card ${ok ? '' : 'bad'}" data-action="containers" data-alias="${alias}">
      <div class="head">
        <div>
          <div class="name">${alias}</div>
          <div class="meta" style="font-size:11px;color:var(--label-3);font-family:var(--mono);margin-top:2px;">
            ${ok ? last.hostname + ' · ' + last.distro : '—'}
          </div>
        </div>
        <span class="status ${ok ? 'ok' : 'bad'}">${ok ? 'online' : 'offline'}</span>
      </div>

      ${ok ? `
        <div class="grid2">
          <div class="stat">
            <div class="l">CPU</div>
            <div class="v">${cpuPct.toFixed(1)}<small>%</small></div>
            <div class="bar ${colorFor(cpuPct, 'cpu')}"><i style="width:${Math.min(cpuPct, 100)}%"></i></div>
            ${sparkSvg(h.cpu)}
          </div>
          <div class="stat">
            <div class="l">Memory</div>
            <div class="v">${memPct.toFixed(0)}<small>%</small></div>
            <div class="bar ${colorFor(memPct, 'mem')}"><i style="width:${Math.min(memPct, 100)}%"></i></div>
            ${sparkSvg(h.mem)}
          </div>
          <div class="stat">
            <div class="l">Load (1m)</div>
            <div class="v">${last.load1.toFixed(2)}</div>
            ${sparkSvg(h.load1)}
          </div>
          <div class="stat">
            <div class="l">Uptime</div>
            <div class="v">${fmtUptime(last.uptime)}</div>
            <div style="margin-top:8px;font-size:11px;color:var(--label-3);font-family:var(--mono);">
              mem ${fmtBytes(last.memUsedMB)} / ${fmtBytes(last.memTotalMB)}
            </div>
          </div>
        </div>

        ${disks.length ? `
          <div class="disks">
            ${disks.map(d => `
              <div class="disk">
                <div style="display:flex;justify-content:space-between;">
                  <span class="name">${d.mount}</span>
                  <span>${d.usedPct}% · ${d.totalGB} GB</span>
                </div>
                <div class="bar ${colorFor(d.usedPct, 'disk')}"><i style="width:${Math.min(d.usedPct, 100)}%"></i></div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div style="margin-top:12px;font-size:11px;color:var(--label-3);font-family:var(--mono);display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
          <span class="containers-pill">${last.containers} container(s) →</span>
          <span>net ↓ ${last.net_rx_kbps || 0} KB/s</span>
          <span>net ↑ ${last.net_tx_kbps || 0} KB/s</span>
          <span>updated ${fmtAgo(last.ts)}</span>
        </div>
      ` : `
        <div class="err">${s.error || 'unreachable'}</div>
        ${sparkSvg([])}
      `}
    </div>
  `
}

async function tick() {
  try {
    const r = await fetch('/api/cluster/status', { cache: 'no-store' })
    const d = await r.json()
    elLast.textContent = fmtAgo(d.lastPollAt)
    elErrs.textContent = String(d.pollErrors || 0)
    elIv.textContent = String(Math.round((d.pollIntervalMs || 30000) / 1000))
    const cards = Object.entries(d.servers).map(([alias, s]) => renderCard(alias, s, d.history[alias] || {}))
    CARDS.innerHTML = cards.join('') || '<div class="loading">no servers configured</div>'
  } catch (e) {
    elLast.textContent = 'fetch failed: ' + e.message
  }
}

tick()
setInterval(tick, POLL_MS)

// --- docker container inspector --------------------------------------------
//
// Click a card → opens the containers modal for that server.
// Click a row in the modal → opens the logs modal for that container.
//
// The modals are built imperatively (single template, populated after
// fetch) rather than as JSX/templates — keeps the file single-file and
// matches the rest of the dashboard's vanilla style.

const ACTIVE_MODAL_BG = document.createElement('div') // reused element for layering
// Modal history stack: when openLogsModal() is called from openContainersModal(),
// the containers modal is pushed here first so Backspace / "←" can pop back
// to it instead of forcing the user to close the modal and reopen it.
// Each entry is { refresh: () => Promise<void> } — calling refresh() re-runs
// the fetch + render for that modal so the user sees up-to-date data when
// they pop back (otherwise the containers list could be minutes stale).
const modalStack = []

function closeModal() {
  ACTIVE_MODAL_BG.remove()
  document.removeEventListener('keydown', onEscClose)
}

function popModal() {
  // Close the current modal and re-open the one below it, if any.
  if (!modalStack.length) {
    closeModal()
    return
  }
  const previous = modalStack.pop()
  closeModal()
  // refresh() is async (it does a fetch) but we don't await — the open
  // happens immediately with the cached body, refresh overlays it.
  if (previous && typeof previous.refresh === 'function') {
    previous.refresh()
  }
}

function onEscClose(e) {
  if (e.key === 'Escape') {
    e.preventDefault()
    closeModal()
  } else if (e.key === 'Backspace' && modalStack.length > 0) {
    // Backspace pops one level of modal history. Disabled at the top
    // level so it doesn't accidentally close the dashboard.
    // Don't interfere with text editing — there's no input/textarea in
    // our modals today, but guard anyway in case we add one later.
    const t = e.target
    const tag = t && t.tagName
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return
    e.preventDefault()
    popModal()
  }
}

function openModal({ title, sub, bodyHtml, footerHtml = '', wide = false }) {
  ACTIVE_MODAL_BG.className = 'modal-bg'
  ACTIVE_MODAL_BG.innerHTML = `
    <div class="modal ${wide ? 'wide' : ''}">
      <div class="mh">
        <div>
          <h2>${escapeHtml(title)}</h2>
          ${sub ? `<div class="sub">${escapeHtml(sub)}</div>` : ''}
        </div>
        <button class="close" aria-label="close">×</button>
      </div>
      <div class="mb">${bodyHtml}</div>
      ${footerHtml ? `<div class="mf">${footerHtml}</div>` : ''}
    </div>
  `
  // Click on the backdrop (outside the .modal box) closes the modal.
  // Click INSIDE the .modal box is ignored — those clicks bubble up to
  // document and either hit the data-action delegation below (which
  // fires openLogsModal etc.) or are no-ops. Earlier revisions used
  // onclick="event.stopPropagation()" on the .modal div to keep inner
  // clicks from closing the modal, but that also broke the data-action
  // delegation: clicks on container rows never reached document. The
  // current handler below discriminates by target — clicking the .modal
  // box itself does NOT close, only the backdrop does.
  ACTIVE_MODAL_BG.addEventListener('click', (e) => {
    if (e.target === ACTIVE_MODAL_BG) closeModal()
  })
  ACTIVE_MODAL_BG.querySelector('button.close').addEventListener('click', closeModal)
  document.addEventListener('keydown', onEscClose)
  document.body.appendChild(ACTIVE_MODAL_BG)
}

// Plain-text-safe HTML escape. The container names and image strings
// come from a remote shell, so we MUST treat them as untrusted — a
// malicious image name like "<img onerror=…>" would otherwise XSS us.
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]))
}

// Short status text. Docker's "Up 3 hours" becomes "up · 3h", "Exited
// (0) 5 minutes ago" becomes "down · 5m". We don't try to parse every
// status — just the leading "Up "/"Exited "/"Restarting "/"Created "
// prefixes, and fall back to the raw string for anything weirder.
function fmtStatus(s) {
  const lower = (s || '').toLowerCase()
  if (lower.startsWith('up ')) return { up: true, text: 'up · ' + s.slice(3) }
  if (lower.startsWith('exited')) return { up: false, text: s }
  if (lower.startsWith('restarting')) return { up: false, text: s }
  if (lower.startsWith('created')) return { up: false, text: s }
  if (lower.startsWith('dead')) return { up: false, text: s }
  return { up: false, text: s || '?' }
}

async function openContainersModal(alias) {
  openModal({
    title: `containers · ${alias}`,
    sub: 'loading…',
    bodyHtml: '<div class="loading">ssh ' + escapeHtml(alias) + ' → docker ps -a …</div>',
  })
  let data
  try {
    const r = await fetch(`/api/server/${encodeURIComponent(alias)}/containers`, { cache: 'no-store' })
    data = await r.json()
  } catch (e) {
    closeModal()
    openModal({ title: `containers · ${alias}`, bodyHtml: `<div class="err-banner">fetch failed: ${escapeHtml(e.message)}</div>` })
    return
  }
  if (!data.ok) {
    closeModal()
    openModal({
      title: `containers · ${alias}`,
      bodyHtml: `<div class="err-banner">${escapeHtml(data.error || 'unknown error')}</div>`,
    })
    return
  }
  if (!data.dockerAvailable) {
    closeModal()
    openModal({
      title: `containers · ${alias}`,
      sub: 'docker not available on this host',
      bodyHtml: `<div class="loading">No docker binary or socket reachable on ${escapeHtml(alias)}. Either docker isn't installed or the bramirezj user can't reach the daemon.</div>`,
    })
    return
  }
  if (!data.containers.length) {
    closeModal()
    openModal({
      title: `containers · ${alias}`,
      sub: 'no containers',
      bodyHtml: `<div class="loading">No containers (running or stopped) on ${escapeHtml(alias)}.</div>`,
    })
    return
  }
  // Sort: running first, then by name. "Up " comes first, then
  // everything else (Exited, Restarting, Created).
  const sorted = [...data.containers].sort((a, b) => {
    const ua = (a.status || '').toLowerCase().startsWith('up ')
    const ub = (b.status || '').toLowerCase().startsWith('up ')
    if (ua !== ub) return ua ? -1 : 1
    return (a.name || '').localeCompare(b.name || '')
  })
  const rows = sorted.map(c => {
    const st = fmtStatus(c.status)
    return `
      <div class="container-row" data-action="logs" data-alias="${escapeHtml(alias)}" data-name="${escapeHtml(c.name)}">
        <span class="dot ${st.up ? 'up' : 'down'}"></span>
        <span class="name">${escapeHtml(c.name)}</span>
        <span class="image">${escapeHtml(c.image)}</span>
        <span class="status">${escapeHtml(st.text)}</span>
      </div>
    `
  }).join('')
  const upCount = sorted.filter(c => (c.status || '').toLowerCase().startsWith('up ')).length
  closeModal()
  openModal({
    title: `containers · ${alias}`,
    sub: `${sorted.length} total · ${upCount} up`,
    bodyHtml: rows,
  })
}

async function openLogsModal(alias, name) {
  // Push the previous (containers) modal onto the history stack so
  // Backspace / "←" can pop back. The refresh callback re-fetches the
  // list so the user sees up-to-date state when they return.
  // We snapshot the alias/name here so the closure stays correct even
  // if the user clicks Backspace twice in a row.
  modalStack.push({ refresh: () => openContainersModal(alias) })

  openModal({
    title: `logs · ${name}`,
    sub: `last 10 lines · ${alias}`,
    bodyHtml: `<div class="loading">ssh ${escapeHtml(alias)} → docker logs --tail=10 ${escapeHtml(name)} …</div>`,
    wide: true,
  })
  let data
  try {
    const r = await fetch(`/api/server/${encodeURIComponent(alias)}/container/${encodeURIComponent(name)}/logs?lines=10`, { cache: 'no-store' })
    data = await r.json()
  } catch (e) {
    closeModal()
    openModal({ title: `logs · ${name}`, bodyHtml: `<div class="err-banner">fetch failed: ${escapeHtml(e.message)}</div>`, wide: true })
    return
  }
  if (!data.ok) {
    closeModal()
    openModal({
      title: `logs · ${name}`,
      sub: alias,
      bodyHtml: `<div class="err-banner">${escapeHtml(data.error || 'unknown error')}</div>`,
      wide: true,
    })
    return
  }
  const body = data.logs && data.logs.trim()
    ? `<div class="log-box">${escapeHtml(data.logs)}</div>`
    : `<div class="log-box"><span class="empty">(container has no log output yet)</span></div>`
  closeModal()
  openModal({
    title: `logs · ${name}`,
    sub: `last ${data.lines} lines · ${alias} · fetched ${fmtAgo(data.fetchedAt)}`,
    bodyHtml: body,
    // The back button sits in the footer (left side). It pops one level
    // of modal history — the user ends up back at the containers
    // modal with up-to-date data. Same behavior as Backspace.
    footerHtml: `<button class="back-btn" data-action="modal-back">← containers</button><span>tail -n ${data.lines} · esc to close · backspace to go back</span>`,
    wide: true,
  })
}

// Event delegation: the [data-action] elements live in two different
// subtrees — the cards live inside #cards, but the container rows in
// the modal live inside the modal which is appended to document.body.
// A listener on CARDS would catch only the first set; we need to
// listen on document so the modal rows bubble up to us too.
// closest('[data-action]') still scopes the handler to the elements
// we actually care about, so we don't fire on background clicks.
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]')
  if (!target) return
  e.preventDefault()
  const action = target.dataset.action
  const alias = target.dataset.alias
  if (action === 'containers') openContainersModal(alias)
  else if (action === 'logs') openLogsModal(alias, target.dataset.name)
  else if (action === 'modal-back') popModal()
})
</script>
</body>
</html>
