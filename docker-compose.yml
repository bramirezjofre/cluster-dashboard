name: cluster-dashboard

# Single-service dashboard. The ssh keys + config are mounted read-only
# from the host's ~/.ssh so the image never contains credentials. The host
# user must exist in /etc/passwd inside the container at the UID the keys
# are owned by — the Dockerfile defaults to 1000:1000 (bramirezj on this
# host); override via BUILD_UID/BUILD_GID if yours is different.
#
# Servers polled are controlled by CLUSTER_SERVERS (comma-separated ssh
# aliases from ~/.ssh/config). The current set: server-11 (RPi), server-17
# (SSD 224GB), server-18 (HDD 500GB), server-19 (HDD 160GB), and
# server-agentes (Ubuntu 24, 8 cores, the only one with /mnt/data
# attached). To drop one, remove it from the env var and recreate the
# container.

services:
  dashboard:
    build: .
    image: cluster-dashboard:latest
    container_name: cluster-dashboard
    restart: unless-stopped
    ports:
      # Bound to 0.0.0.0 so the dashboard is reachable from the LAN
      # (phone, laptop, etc.) at http://<host-ip>:9090. The daemon serves
      # the same data with no auth, so only do this on a network you
      # trust. If you want to expose it beyond the LAN, put it behind
      # Nginx Proxy Manager with auth — see README.
      - "9090:9090"
    environment:
      PORT: "9090"
      POLL_INTERVAL_MS: "30000"
      HISTORY_SAMPLES: "120"
      SSH_CONNECT_TIMEOUT_MS: "5000"
      SSH_CMD_TIMEOUT_MS: "4000"
      SSH_USER: "bramirezj"
      SSH_KEYS_DIR: "/home/bramirezj/.ssh"
      CLUSTER_SERVERS: "server-11,server-17,server-18,server-19,server-agentes"
      # Telegram alerting. To disable, set ALERT_ENABLED=false. To enable,
      # fill in a bot token (from @BotFather) and a chat id (the numeric
      # id of a group the bot is admin of; you can see it in @RawDataBot
      # output). The token and chat id live in .env (which is gitignored)
      # rather than the compose file so they don't leak into git history.
      ALERT_ENABLED: "true"
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID}
      ALERT_DISK_THRESHOLD: "65"
      ALERT_COOLDOWN_MIN: "60"
    volumes:
      - /home/bramirezj/.ssh:/home/bramirezj/.ssh:ro
      # The .env file holds secrets (telegram bot token, chat id). Compose
      # substitutes ${ALERT_*} from it. Not in the image, not in git.
      - ./.env:/app/.env:ro
      # Persistent storage: SQLite DB (history) + alert-state.json (cooldowns).
      # Both live in the same named volume so a container recreate doesn't
      # wipe long-term history or reset alert cooldowns/fail counters.
      - cluster-dashboard-data:/data
    # No healthcheck yet — the daemon listens on PORT but doesn't expose
    # a readiness probe that distinguishes "polling" from "crashed". Add a
    # GET /api/health that returns 200 only after the first successful poll
    # if you wire healthcheck to compose's depends_on: condition: healthy.

volumes:
  cluster-dashboard-data:
    # Named volume for SQLite history + alert state. docker compose creates
    # it on first up; subsequent recreates of the service re-attach the
    # same backing directory so data survives.